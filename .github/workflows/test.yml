name: Ant Media Server Community Edition Test

on:
  push:
    branches:
      - '**'
    tags:
      - 'ams-v*'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  checks: write
  # Needed to download last-known-good OWASP DB artifacts from the update workflow.
  actions: read

env:
  RUNNER: ubuntu-22.04

jobs:  
  run-unit-tests:
    name: Run unit tests
    runs-on: ubuntu-22.04
    env:
      GPG_TTY: ${{ secrets.GPG_TTY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
      CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
      GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt' #openjdk
          java-version: '17'
          cache: 'maven'
        
      - name: Add MongoDB 6.0 GPG key and repository
        run: |
          if [ ! -f /usr/share/keyrings/mongodb-server-6.0.gpg ]; then
            curl -fsSL https://pgp.mongodb.com/server-6.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-6.0.gpg --dearmor
          fi
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-6.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-6.0.list
      
      - name: Add Redis repository
        run: |
            sudo rm -rf /usr/share/keyrings/redis-archive-keyring.gpg
            curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y redis redis-tools mongodb-org ffmpeg wondershaper

      - name: Start Redis
        run: sudo systemctl start redis-server

      - name: Start MongoDB
        run: sudo systemctl start mongod

      - name: Install Onvif Simulator
        run: sudo git clone --depth=1 https://github.com/ant-media/utilities.git /usr/local/onvif

      - name: Build projects
        uses: ./.github/actions/build-projects 
        with:
          branch_name: ${{ github.head_ref || github.ref_name }}
           
          
      - name: Run tests and SonarCloud analysis
        run: |
          export RELEASE_VERSION="$(mvn -q -Dexec.executable="echo" -Dexec.args='${project.version}' --non-recursive exec:exec)"
          echo $RELEASE_VERSION
          mvn clean org.jacoco:jacoco-maven-plugin:prepare-agent package -Dtest=!*/integration/* -Dorg.bytedeco.javacpp.logger.debug=false org.jacoco:jacoco-maven-plugin:report sonar:sonar -Dmaven.javadoc.skip=true

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Publish unit test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Unit Test Report
          report_paths: target/surefire-reports/TEST-*.xml
          fail_on_failure: false
          require_tests: false
          detailed_summary: true
          include_time_in_summary: true
      
      - name: Show MongoDB Log, Crash Log and Servis Status on failure
        if: failure()
        run: |
          if [[ -f /var/log/mongodb/mongod.log ]]; then
            sudo cat /var/log/mongodb/mongod.log
          fi
          if [[ -f hs_err_pid*.log ]]; then
            cat hs_err_pid*.log
          else
            echo "No hs_err_pid*.log file found"
          fi
          sudo service mongod status
          sudo service redis-server status

  # Hard gate for deploy. Never hit NVD here: use cache, else last successful nightly artifact.
  check-vulnerabilities:
    runs-on: ubuntu-22.04
    name: Check vulnerabilities
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt' #openjdk
          java-version: '17'
          cache: 'maven'
        
      - name: Build projects
        uses: ./.github/actions/build-projects 
        with:
          branch_name: ${{ github.head_ref || github.ref_name }}
           
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
            
      - name: Restore OWASP Dependency Check DB
        uses: actions/cache/restore@v4
        with:
          path: ~/.dependency-check-data
          key: owasp-dependency-check-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            owasp-dependency-check-db-${{ runner.os }}-

      - name: Check whether local OWASP DB is usable
        id: owasp-db
        run: |
          DATA_DIR="$HOME/.dependency-check-data"
          if [ -d "$DATA_DIR" ] && [ -n "$(ls -A "$DATA_DIR" 2>/dev/null)" ]; then
            SIZE_KB=$(du -sk "$DATA_DIR" | cut -f1)
            echo "Restored OWASP DB size: ${SIZE_KB} KB"
            if [ "$SIZE_KB" -ge 51200 ]; then
              echo "has_db=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Restored cache looks too small; will try last-known-good artifact."
          else
            echo "No usable cache; will try last-known-good artifact."
          fi
          echo "has_db=false" >> "$GITHUB_OUTPUT"

      - name: Restore last-known-good OWASP DB artifact
        if: steps.owasp-db.outputs.has_db != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "update-owasp.yml" \
            --branch master \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful Update OWASP Dependency DB run found on master. Branch checks need a last-known-good DB artifact."
            exit 1
          fi
          echo "Downloading owasp-db-latest from successful run $RUN_ID"
          rm -rf /tmp/owasp-db-artifact "$HOME/.dependency-check-data"
          mkdir -p /tmp/owasp-db-artifact
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name owasp-db-latest \
            --dir /tmp/owasp-db-artifact
          if [ ! -f /tmp/owasp-db-artifact/owasp-db-latest.tar.gz ]; then
            echo "::error::Artifact owasp-db-latest.tar.gz missing from run $RUN_ID. Re-run Update OWASP Dependency DB once after merging this change."
            exit 1
          fi
          tar -xzf /tmp/owasp-db-artifact/owasp-db-latest.tar.gz -C "$HOME"

      - name: Verify OWASP DB is present
        run: |
          DATA_DIR="$HOME/.dependency-check-data"
          if [ ! -d "$DATA_DIR" ] || [ -z "$(ls -A "$DATA_DIR" 2>/dev/null)" ]; then
            echo "::error::OWASP Dependency Check DB is missing after cache/artifact restore. Refusing to hit NVD from PR/push checks."
            exit 1
          fi
          SIZE_KB=$(du -sk "$DATA_DIR" | cut -f1)
          echo "OWASP DB size: ${SIZE_KB} KB"
          if [ "$SIZE_KB" -lt 51200 ]; then
            echo "::error::OWASP DB looks too small (${SIZE_KB} KB)."
            exit 1
          fi
          ls -lah "$DATA_DIR"
          du -sh "$DATA_DIR"

      - name: Check vulnerabilities
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -Dnoupdate=true \
            -DautoUpdate=false \
            -DdataDirectory=$HOME/.dependency-check-data \
            -Dformat=ALL \
            -DfailOnError=true

      - name: Write vulnerability Step Summary
        if: always()
        run: |
          python3 <<'PY'
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          report = Path("target/dependency-check-report.json")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          threshold = 7.0

          def cvss_score(vuln: dict) -> float:
              for key in ("cvssv4", "cvssv3", "cvssv2"):
                  block = vuln.get(key) or {}
                  if isinstance(block, dict):
                      for score_key in ("baseScore", "score"):
                          value = block.get(score_key)
                          if value is not None:
                              try:
                                  return float(value)
                              except (TypeError, ValueError):
                                  pass
              for key in ("cvssScore", "severityScore"):
                  value = vuln.get(key)
                  if value is not None:
                      try:
                          return float(value)
                      except (TypeError, ValueError):
                          pass
              return 0.0

          def dep_name(dep: dict) -> tuple[str, str]:
              packages = dep.get("packages") or []
              if packages:
                  pkg = packages[0]
                  coords = (pkg.get("id") or "").replace("pkg:maven/", "")
                  if "@" in coords:
                      name, version = coords.rsplit("@", 1)
                      return name, version
              file_name = dep.get("fileName") or dep.get("filePath") or "unknown"
              return file_name, ""

          if not report.is_file():
              summary.write_text(
                  "## OWASP Dependency Check\n\n"
                  "No `target/dependency-check-report.json` was produced.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          data = json.loads(report.read_text(encoding="utf-8"))
          rows = []
          for dep in data.get("dependencies") or []:
              name, version = dep_name(dep)
              for vuln in dep.get("vulnerabilities") or []:
                  score = cvss_score(vuln)
                  if score < threshold:
                      continue
                  rows.append(
                      {
                          "dependency": name,
                          "version": version,
                          "cve": vuln.get("name") or "unknown",
                          "severity": vuln.get("severity") or "",
                          "cvss": score,
                      }
                  )

          rows.sort(key=lambda r: (-r["cvss"], r["dependency"], r["cve"]))
          by_dep = defaultdict(lambda: {"max": 0.0, "count": 0, "version": ""})
          for row in rows:
              key = row["dependency"]
              by_dep[key]["count"] += 1
              by_dep[key]["max"] = max(by_dep[key]["max"], row["cvss"])
              by_dep[key]["version"] = row["version"] or by_dep[key]["version"]

          lines = [
              "## OWASP Dependency Check",
              "",
              f"Gate: **CVSS ≥ {threshold:.1f}** (`failBuildOnCVSS`).",
              "",
          ]

          if not rows:
              lines.extend(
                  [
                      "No vulnerabilities at or above the gate threshold.",
                      "",
                      "Full reports are attached as workflow artifacts when available.",
                      "",
                  ]
              )
          else:
              critical = sum(1 for r in rows if r["cvss"] >= 9.0)
              high = sum(1 for r in rows if 7.0 <= r["cvss"] < 9.0)
              lines.extend(
                  [
                      f"- Failing dependencies: **{len(by_dep)}**",
                      f"- Findings ≥ {threshold:.1f}: **{len(rows)}**",
                      f"- Critical (CVSS ≥ 9.0): **{critical}**",
                      f"- High (7.0 ≤ CVSS < 9.0): **{high}**",
                      "",
                      "### By dependency",
                      "",
                      "| Dependency | Version | Max CVSS | CVE count |",
                      "|---|---|---:|---:|",
                  ]
              )
              for name, stats in sorted(
                  by_dep.items(), key=lambda item: (-item[1]["max"], -item[1]["count"], item[0])
              ):
                  version = stats["version"] or "-"
                  lines.append(
                      f"| `{name}` | `{version}` | {stats['max']:.1f} | {stats['count']} |"
                  )

              lines.extend(
                  [
                      "",
                      "### CVE detail",
                      "",
                      "| CVSS | Severity | CVE | Dependency | Version |",
                      "|---:|---|---|---|---|",
                  ]
              )
              for row in rows:
                  version = row["version"] or "-"
                  lines.append(
                      f"| {row['cvss']:.1f} | {row['severity']} | `{row['cve']}` | `{row['dependency']}` | `{version}` |"
                  )
              lines.append("")

          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Wrote Step Summary with {len(rows)} gated finding(s)")
          PY

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: ignore

      - name: Show MongoDB Log, Crash Log and Servis Status on failure
        if: failure()
        run: |
          if [[ -f /var/log/mongodb/mongod.log ]]; then
            sudo cat /var/log/mongodb/mongod.log
          fi
          if [[ -f hs_err_pid*.log ]]; then
            cat hs_err_pid*.log
          else
            echo "No hs_err_pid*.log file found"
          fi
          sudo service mongod status
          sudo service redis-server status           
          
  run-integration-tests:
    name: Run integration tests
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt' #openjdk
          java-version: '17'
          cache: 'maven'
          
    
      - name: Add MongoDB 6.0 GPG key and repository
        run: |
          if [ ! -f /usr/share/keyrings/mongodb-server-6.0.gpg ]; then
            curl -fsSL https://pgp.mongodb.com/server-6.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-6.0.gpg --dearmor
          fi
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-6.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-6.0.list
      
      - name: Add Redis repository
        run: |
            sudo rm -rf /usr/share/keyrings/redis-archive-keyring.gpg
            curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
      
      - name: Install FFmpeg 7
        run: |
          curl -L --retry 5 --retry-delay 10 \
            -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-linux64-gpl-7.1.tar.xz
          mkdir -p /tmp/ffmpeg
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          sudo install -m 0755 /tmp/ffmpeg/bin/ffmpeg /usr/local/bin/ffmpeg
          sudo install -m 0755 /tmp/ffmpeg/bin/ffprobe /usr/local/bin/ffprobe
          ffmpeg_version="$(ffmpeg -version | head -n 1)"
          echo "$ffmpeg_version"
          echo "$ffmpeg_version" | grep -Eq "ffmpeg version n?7\."
            
      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y redis redis-tools mongodb-org wondershaper
          ffmpeg -version | head -n 1

      - name: Start Redis
        run: sudo systemctl start redis-server

      - name: Start MongoDB
        run: sudo systemctl start mongod

      - name: Install Chrome
        run: |
         wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
         sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
         
      - name: Install Onvif Simulator
        run: sudo git clone --depth=1 https://github.com/ant-media/utilities.git /usr/local/onvif

      - name: Build projects
        uses: ./.github/actions/build-projects 
        with:
          branch_name: ${{ github.head_ref || github.ref_name }}
     
      - name: Package Ant Media Server
        run: mvn clean package -U -P assemble -Dmaven.javadoc.skip=true -Dmaven.test.skip=true -DskipTests=true --quiet
        
      - name: Install Ant Media Server
        run: |
          wget https://raw.githubusercontent.com/ant-media/Scripts/${{ github.ref_name }}/install_ant-media-server.sh -O target/install_ant-media-server.sh || wget https://raw.githubusercontent.com/ant-media/Scripts/master/install_ant-media-server.sh -O target/install_ant-media-server.sh
          chmod 755 target/install_ant-media-server.sh
          cd target
          sudo ./install_ant-media-server.sh -i ant-media-server-community*.zip
          cd ..
          sleep 20
          sudo cp src/test/resources/preset-red5-web.properties /usr/local/antmedia/webapps/LiveApp/WEB-INF/red5-web.properties
          sudo cp src/test/resources/preset-red5-web.db /usr/local/antmedia/liveapp.db
          sudo sed -i 's^server.cpu_limit=.*^server.cpu_limit=100^' /usr/local/antmedia/conf/red5.properties
          sudo sed -i 's^server.memory_limit_percentage=.*^server.memory_limit_percentage=100^' /usr/local/antmedia/conf/red5.properties
          sudo chown -R antmedia:antmedia /usr/local/antmedia/
          sudo service antmedia stop
          sudo service antmedia start
          sleep 10
          
      - name: Run integration tests
        run: |
          export RELEASE_VERSION="$(mvn -q -Dexec.executable="echo" -Dexec.args='${project.version}' --non-recursive exec:exec)"
          echo $RELEASE_VERSION
          mvn clean org.jacoco:jacoco-maven-plugin:prepare-agent package -Dtest=*/integration/* -Dmaven.javadoc.skip=true --quiet

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Publish integration test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Integration Test Report
          report_paths: target/surefire-reports/TEST-*.xml
          fail_on_failure: false
          require_tests: false
          detailed_summary: true
          include_time_in_summary: true
      

      - name: Show Ant Media Server Error Log on failure
        if: failure()
        run: cat /usr/local/antmedia/log/antmedia-error.log
          
      - name: Show Ant Media Server Log on failure
        if: failure()
        run: cat /usr/local/antmedia/log/ant-media-server.log
          
      - name: Show MongoDB Log, Crash Log and Servis Status on failure
        if: failure()
        run: |
          if [[ -f /var/log/mongodb/mongod.log ]]; then
            sudo cat /var/log/mongodb/mongod.log
          fi
          if [[ -f /usr/local/antmedia/hs_err_pid*.log ]]; then
            cat /usr/local/antmedia/hs_err_pid*.log
          fi
          if [[ -f hs_err_pid*.log ]]; then
            cat hs_err_pid*.log
          else
            echo "No hs_err_pid*.log file found"
          fi
          sudo service mongod status
          sudo service redis-server status    
   
   
  deploy:   
    runs-on: ubuntu-22.04
    needs: [run-unit-tests, check-vulnerabilities, run-integration-tests]    
    env:
      CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
      CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
      GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
                  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt' #openjdk
          java-version: '17'
          cache: 'maven'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          
      - name: Build projects # there is low probability that if somethings has pushed to the related branch while running test and before this job, it may build something not exactly same
        uses: ./.github/actions/build-projects 
        with:
          branch_name: ${{ github.head_ref || github.ref_name }}
      - name: Deploy snapshots
      #if it is a master branch
        if: github.ref == 'refs/heads/master' #if it is a master branch
        run: |
          echo "Deploy to snapshots"
          mvn deploy -P assemble -DskipTests --settings mvn-settings.xml
          echo "Deploy to snapshots exited with $?"

      - name: Deploy release
       #if it is a tagged 
        if: startsWith(github.ref, 'refs/tags/ams-v')
        run: |
          echo "Deploy to release"
          mvn deploy -P assemble -DskipTests --settings mvn-settings.xml --quiet
          echo "Deploy to release exited with $?"
