name: 'Build Projects'
description: 'Clone and Build directly dependent projects to package Ant Media Server'
inputs:
  branch_name:  
    description: 'build branch name'
    required: true
    default: 'master'


runs:
  using: "composite"
  steps:

    - name: Clone and build Ant Media Server Parent project
      shell: bash
      run: |
          BRANCH="${{ inputs.branch_name }}"
          echo "Building dependent projects for branch: ${BRANCH}"
          if ! git clone --depth=1 -b "${BRANCH}" https://github.com/ant-media/ant-media-server-parent.git; then
            echo "::warning::Branch '${BRANCH}' not found in ant-media-server-parent; falling back to master"
            git clone --depth=1 https://github.com/ant-media/ant-media-server-parent.git
          fi
          cd ant-media-server-parent
          echo "Parent pom netty.version=$(grep -m1 '<netty.version>' pom.xml | sed 's/.*>\(.*\)<.*/\1/')"
          mvn clean install -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true --quiet
          cd ..
     
    - name: Build Ant Media Server project #let the dependencies be resolved
      shell: bash
      run: mvn clean install -Dmaven.javadoc.skip=true -Dmaven.test.skip=true -Dgpg.skip=true --quiet
    
    - name: Clone and build StreamApp project
      shell: bash
      run: |
          git clone --depth=1 -b ${{ inputs.branch_name }} https://github.com/ant-media/StreamApp.git || git clone --depth=1 https://github.com/ant-media/StreamApp.git
          cd StreamApp
          npm install
          npm run compile
          cd embedded-player
          npm install
          npm run compile
          npm run deploy
          cd ..
          mvn clean install -DskipTests -Dmaven.javadoc.skip=true -Dgpg.skip=true -B -V --quiet
          cd ..

    - name: Fetch web panel
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
          repo="ant-media/management-panel-reborn"
          if gh release download -R "$repo" --pattern '*.zip' --dir /tmp --clobber; then
            echo "Using latest published panel release."
          elif gh release download snapshot -R "$repo" --pattern '*.zip' --dir /tmp --clobber; then
            echo "::warning::No published panel release yet; using snapshot pre-release."
          else
            echo "::error::No panel release or snapshot found at $repo. Publish a panel release."; exit 1
          fi
          zip="$(ls /tmp/panel-release-*.zip 2>/dev/null | head -1)"
          [ -n "$zip" ] || { echo "::error::Panel downloaded but no panel-release-*.zip asset found."; exit 1; }
          echo "Using panel: $(basename "$zip")"
          unzip -o -q "$zip" -d src/main/server/webapps/root/
                  
 
    - name: Replace ffmpeg builds
      shell: bash
      run: |
           wget -O ~/.m2/repository/org/bytedeco/ffmpeg/7.1-1.5.11/ffmpeg-7.1-1.5.11-linux-x86_64.jar https://storage.sbg.cloud.ovh.net/v1/AUTH_8cb28f9bc6ee43f0a3a1825efbb4311e/test-storage/ffmpeg-7.1-1.5.11-linux-x86_64.jar
           wget -O ~/.m2/repository/org/bytedeco/ffmpeg/7.1-1.5.11/ffmpeg-7.1-1.5.11-linux-arm64.jar https://storage.sbg.cloud.ovh.net/v1/AUTH_8cb28f9bc6ee43f0a3a1825efbb4311e/test-storage/ffmpeg-7.1-1.5.11-linux-arm64.jar
